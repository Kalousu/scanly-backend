spring.application.name=scanlyBackend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scanly_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scanly_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scanly123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true