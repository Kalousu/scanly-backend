services:
  db:
    image: postgres:17-alpine
    container_name: scanly-db
    environment:
      POSTGRES_USER: scanly_user
      POSTGRES_PASSWORD: scanly123
      POSTGRES_DB: scanly_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanly_user -d scanly_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: scanly-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/scanly_db
      SPRING_DATASOURCE_USERNAME: scanly_user
      SPRING_DATASOURCE_PASSWORD: scanly123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../scanly-frontend
      dockerfile: Dockerfile
    container_name: scanly-frontend
    ports:
      - "80:80"
    depends_on:
      - backend